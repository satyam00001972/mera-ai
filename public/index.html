<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mera AI</title>
<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#101827;
    color:white;
}
.app{
    max-width:600px;
    height:100vh;
    margin:auto;
    display:flex;
    flex-direction:column;
}
header{
    padding:18px;
    background:#182235;
    text-align:center;
    font-size:22px;
    font-weight:bold;
}
#chat{
    flex:1;
    overflow:auto;
    padding:15px;
}
.msg{
    padding:12px;
    margin:10px 0;
    border-radius:15px;
    max-width:85%;
    white-space:pre-wrap;
}
.user{
    background:#4f46e5;
    margin-left:auto;
}
.ai{
    background:#253149;
}
.bottom{
    padding:10px;
    background:#182235;
    display:flex;
    gap:8px;
}
textarea{
    flex:1;
    resize:none;
    border:0;
    outline:0;
    border-radius:12px;
    padding:12px;
}
button{
    border:0;
    border-radius:12px;
    padding:12px 16px;
    background:#4f46e5;
    color:white;
    font-size:18px;
}
</style>
</head>

<body>

<div class="app">

<header>🤖 Mera AI</header>

<div id="chat">
<div class="msg ai">
नमस्ते! मैं Mera AI हूँ। आप मुझसे कोई भी सवाल पूछ सकते हैं।
</div>
</div>

<div class="bottom">

<textarea
id="question"
placeholder="अपना सवाल लिखें..."
rows="1">
</textarea>

<button onclick="sendMessage()">➤</button>

</div>

</div>

<script>

async function sendMessage(){

const input =
document.getElementById("question");

const text =
input.value.trim();

if(!text) return;

addMessage(text,"user");

input.value="";

try{

const response =
await fetch("/api/chat",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
messages:[
{
role:"user",
content:text
}
]
})

});

const data =
await response.json();

if(!response.ok){
throw new Error(data.error);
}

addMessage(data.answer,"ai");

}
catch(error){

addMessage(
"❌ अभी AI से जवाब नहीं मिला। Backend सेटअप करना बाकी है।",
"ai"
);

}

}

function addMessage(text,type){

const chat =
document.getElementById("chat");

const div =
document.createElement("div");

div.className="msg "+type;

div.textContent=text;

chat.appendChild(div);

chat.scrollTop=chat.scrollHeight;

}

</script>

</body>
</html>
